name: P00 foundation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: cena_ci_ephemeral_root
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pcena_ci_ephemeral_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, intl, mbstring, openssl, pdo_mysql, tokenizer, xml, zip
          tools: composer:2.9.4
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Create disposable database users and ignored env files
        run: php scripts/configure-env.php --ci
        env:
          CENA_DB_PORT: '3306'
          CENA_MYSQL_ROOT_PASSWORD: cena_ci_ephemeral_root
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer check-platform-reqs
      - run: npm ci
      - run: npm run build
      - run: php artisan migrate --force --no-interaction
      - run: php artisan migrate --env=testing --force --no-interaction
      - run: php artisan test --compact
      - name: Format and require a clean diff
        run: |
          php vendor/bin/pint --format agent
          git diff --exit-code
