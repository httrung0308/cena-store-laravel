            <stop offset="45%" stop-color="#201464"/>
            <stop offset="85%" stop-color="#190e50"/>
            <stop offset="100%" stop-color="#0d0728"/>
        </linearGradient>
        <radialGradient id="glow" cx="65%" cy="35%" r="60%">
